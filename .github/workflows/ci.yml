
name: CI - Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Actualizar README
        env:
          FEATURE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          LINE="Añadida feature: $FEATURE_BRANCH"
          touch README.md
          if ! grep -Fxq "$LINE" README.md; then
            echo "$LINE" >> README.md
          fi

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar README con nueva feature"
            git push
          fi

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Host "CORRECTO: Los tokens coinciden."
          } else {
            Write-Host "ERROR: Los tokens no coinciden."
            exit 1
          }
