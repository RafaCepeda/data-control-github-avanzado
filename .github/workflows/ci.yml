
name: CI - Develop

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar feature fusionada
        id: feature
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PR_NUMBER=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "develop" and .merged_at != null and (.head.ref | startswith("feature/")))] | first | .number // empty')

          if [ -n "$PR_NUMBER" ]; then
            FEATURE_BRANCH=$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.ref')

            echo "branch=$FEATURE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Feature detectada: $FEATURE_BRANCH"
          else
            echo "No se ha detectado una feature fusionada."
          fi

      - name: Actualizar README
        if: steps.feature.outputs.branch != ''
        env:
          FEATURE_BRANCH: ${{ steps.feature.outputs.branch }}
        run: |
          LINE="Añadida feature: $FEATURE_BRANCH"

          if ! grep -Fxq "$LINE" README.md; then
            printf '\n%s\n' "$LINE" >> README.md
            echo "README actualizado:"
            git diff -- README.md
          else
            echo "La feature ya figura en README.md."
          fi

      - name: Crear Pull Request para README
        if: steps.feature.outputs.branch != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: automation/update-readme-develop
          delete-branch: true
          commit-message: "docs: actualizar README con feature fusionada"
          title: "Actualizar README con feature fusionada"
          body: |
            Actualización automática del README generada por CI.

            Añade la feature fusionada a develop.
          add-paths: README.md

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Host "CORRECTO: Los tokens coinciden."
          } else {
            Write-Host "ERROR: Los tokens no coinciden."
            exit 1
          }
