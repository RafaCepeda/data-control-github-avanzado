
name: Prueba de tokens

on:
  push:

jobs:
  comprobar-token:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: cmd
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          @echo off
          if "%DEV_TOKEN%"=="%LOCAL_DEV_TOKEN%" (
            echo CORRECTO: Los tokens coinciden.
          ) else (
            echo ERROR: Los tokens no coinciden.
            exit /b 1
          )
# Segunda prueba: comprobacion con token local modificado
# Tercera prueba: verificar fallo por token diferente
